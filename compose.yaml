services:
  app:
    image: sista-cemerlang:latest
    container_name: sista_app_prod
    restart: unless-stopped
    ports:
      - "8888:80"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sista_db_prod
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: db_percetakan
      MYSQL_USER: laravel
      MYSQL_PASSWORD: jojo3175
      MYSQL_ROOT_PASSWORD: jojo3175
    volumes:
      - sista_mysql_data:/var/lib/mysql

volumes:
  sista_mysql_data: